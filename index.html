<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberracing Idle</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css?v=202610300734" />
</head>
<body>
<div id="app">

  <!-- ── Header / HUD ──────────────────────────────────────────────────── -->
  <header id="header">
    <div id="logo">CYBER<span>RACING</span> IDLE<button id="version-btn" class="version-btn" title="What's new">v0.0.0</button></div>
    <div id="hud">
      <div class="hud-stat hud-team">
        <div class="hud-label">Team</div>
        <div class="hud-value" id="hud-team-wrap">
          <span id="hud-team">Cyberracing</span>
          <button class="hud-rename-btn" id="hud-rename-btn" title="Rename team" aria-label="Rename team">✎</button>
        </div>
      </div>
      <div class="hud-stat">
        <div class="hud-label">Money</div>
        <div class="hud-value" id="hud-money">$0</div>
      </div>
      <div class="hud-stat" id="hud-salary-stat">
        <div class="hud-label">Salaries due</div>
        <div class="hud-value" id="hud-salary">$0</div>
      </div>
      <div class="hud-stat">
        <div class="hud-label">Sponsors</div>
        <div class="hud-value" id="hud-ips">$0/s</div>
      </div>
      <div class="hud-stat">
        <div class="hud-label">Reputation</div>
        <div class="hud-value" id="hud-rep">0 REP</div>
      </div>
      <div class="hud-stat">
        <div class="hud-label" id="hud-season-label">Season 1</div>
        <div class="hud-value" id="hud-season">60:00</div>
      </div>
      <div class="hud-stat">
        <div class="hud-label">Prestige</div>
        <div class="hud-value" id="hud-pp">0 PP</div>
      </div>
    </div>
  </header>

  <!-- ── Tab Bar ────────────────────────────────────────────────────────── -->
  <nav id="tab-bar">
    <button class="tab-btn active" data-tab="garage">Garage</button>
    <button class="tab-btn" data-tab="championships">Championships</button>
    <button class="tab-btn" data-tab="drivers">Drivers</button>
    <button class="tab-btn" data-tab="sponsors">Sponsors</button>
    <button class="tab-btn" data-tab="staff">Staff</button>
    <button class="tab-btn" data-tab="hq">HQ</button>
    <button class="tab-btn" data-tab="prestige">Season</button>
  </nav>

  <!-- ── Main Layout ───────────────────────────────────────────────────── -->
  <div id="main">

    <!-- Content -->
    <div id="content">

      <!-- Garage Panel -->
      <div id="panel-garage" class="tab-panel active"></div>

      <!-- Championships Panel -->
      <div id="panel-championships" class="tab-panel"></div>

      <!-- Drivers Panel -->
      <div id="panel-drivers" class="tab-panel"></div>

      <!-- Sponsors Panel -->
      <div id="panel-sponsors" class="tab-panel"></div>

      <!-- Staff Panel -->
      <div id="panel-staff" class="tab-panel"></div>

      <!-- Team HQ Panel -->
      <div id="panel-hq" class="tab-panel"></div>

      <!-- Prestige Panel -->
      <div id="panel-prestige" class="tab-panel"></div>

    </div>

    <!-- Sidebar (Event Feed) -->
    <aside id="sidebar">
      <div class="sidebar-label">Event Feed</div>
      <div id="notification-feed">
        <div class="notif notif-info">Game started. Your GT4 is on track.</div>
      </div>
    </aside>

  </div>
</div>

<!-- Scripts: data → game → ui -->
<script src="js/data.js?v=202610300734"></script>
<script src="js/changelog.js?v=202610300734"></script>
<script src="js/game.js?v=202610300734"></script>
<script src="js/ui.js?v=202610300734"></script>
<script>
  // Boot
  initGame();
  initUI();
</script>
</body>
</html>
